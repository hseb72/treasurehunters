# Application Argo CD — Treasure Hunters.
#
# Pattern `shared` CANONIQUE de platform-patterns (chart `app` 1.0.0) : le chart,
# publié en OCI et ÉPINGLÉ, possède les DEUX namespaces de l'app
# (`ui-treasurehunters`, `api-treasurehunters`) et y rend tout — workloads,
# Ingress (nginx + kong), NetworkPolicies. Plus de source `deploy/manifests`.
#
# Modèle « pull » : Argo lit la branche d'environnement `deploy-state`, que la CI
# tient à jour (copie de deploy/ depuis master + SHA d'image promu dans
# deploy/values-image.yaml). master est protégée ; la CI n'y écrit pas.
#
# Toutes les sources du dépôt visent la MÊME révision : Argo CD refuse que deux
# sources de référence d'un même dépôt pointent sur des révisions différentes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: treasurehunters
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: treasurehunters
  sources:
    # 1. Le chart du pattern — version immuable, montée par choix explicite.
    - repoURL: ghcr.io/hseb72/platform-patterns
      chart: app
      targetRevision: 1.0.0
      helm:
        releaseName: treasurehunters
        valueFiles:
          - $values/deploy/values.yaml
          - $values/deploy/values-image.yaml
    # 2. Les valeurs et le SHA d'image, depuis la branche d'environnement.
    - repoURL: https://github.com/hseb72/treasurehunters.git
      targetRevision: deploy-state
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Namespace par défaut d'Argo. Le chart rend chaque ressource avec son propre
    # namespace (ui-/api-treasurehunters) et crée les Namespaces lui-même.
    namespace: api-treasurehunters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Plus de CreateNamespace ni de managedNamespaceMetadata : le chart possède
    # les namespaces et y pose les étiquettes d'adhésion (postgres + minio).
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
