# Front — servi directement par ingress-nginx (TLS cert-manager + WAF), sans
# passer par Kong. Le front relaie lui-même /api vers Kong (cf. docker/nginx.conf.template).
#
# ⚠ Cet hôte est aussi celui imprimé dans les QR codes (https://<hôte>/q/<jeton>) :
# il ne doit plus changer une fois les QR posés.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: treasurehunters
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Preuve par photo : image de 6 Mo au plus (encodée en base64).
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - treasurehunters.crealcs.com
      secretName: treasurehunters-tls
  rules:
    - host: treasurehunters.crealcs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
